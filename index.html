<style>
  :root{
    --bg:#FFF8F2; --card:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#F0CCA8;
    --accent:#C25A0C; --accent-soft:#FDEBD8; --accent-ink:#7D3408;
    --ok:#0F6E56; --ok-soft:#E1F5EE; --danger:#A32D2D; --danger-soft:#FCEBEB;
    --weekend-bg:#FFF3E0; --weekend-border:#FFCC80; --weekend-num:#B07000;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);}
  header{background:var(--accent);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:transparent;color:#fff;padding:8px 14px;font-size:14px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--accent);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;}
  button.btn{padding:11px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;}
  button.btn:hover{background:#f0f2f5;}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.btn.ghost{background:transparent;}
  button.btn.danger{color:var(--danger);border-color:var(--danger-soft);}
  .row{display:grid;gap:12px;}
  .grid2{grid-template-columns:1fr 1fr;}
  .pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);}
  .pill.live{background:var(--ok-soft);color:var(--ok);}
  .pill.local{background:#fdecdc;color:#854F0B;}
  .dow{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px;}
  .day{border:1px solid var(--line);border-radius:8px;padding:5px;min-height:60px;background:#fff;}
  .day.empty{border:none;background:transparent;}
  .day.weekend{background:var(--weekend-bg);border-color:var(--weekend-border);}
  .day.weekend .dn{color:var(--weekend-num);font-weight:600;}
  .dow.we{color:var(--weekend-num);font-weight:600;}
  .dn{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .t{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:1px 1px 0 0;display:inline-block;}
  .t.sel{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .t.cpo-btn{width:100%;text-align:center;padding:4px 0;font-size:12px;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{background:#f7f8fa;color:var(--muted);font-weight:600;}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef1f5;margin:0 4px 4px 0;display:inline-block;}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:99;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0;}
  .svc-edit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .turno-tag{display:inline-flex;align-items:center;gap:6px;background:#eef1f5;border-radius:6px;padding:4px 9px;font-size:12px;margin:0 6px 6px 0;}
  .turno-tag button{border:none;background:none;cursor:pointer;color:var(--danger);font-size:15px;line-height:1;}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sp{justify-content:space-between;}
  #installBar{display:none;background:var(--accent-soft);color:var(--accent-ink);padding:10px 16px;
    text-align:center;font-size:14px;align-items:center;justify-content:center;gap:10px;}
  #installBar button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}.cal{gap:3px;}.day{min-height:54px;padding:4px;}}
</style>
</head>
<body>
<header id="appHeader" style="display:none;">
  <h1><img src="icon-192.png" alt="" style="width:26px;height:26px;border-radius:5px;background:#fff;vertical-align:middle;"> Escala CPO</h1>
  <div class="flex" style="gap:10px;">
    <div class="seg" id="seg">
      <button class="on" data-v="emp">Operacionais</button>
      <button data-v="admin" id="adminTab" style="display:none;">Administrador</button>
    </div>
    <button id="logoutBtn" class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4);padding:7px 12px;">Sair</button>
  </div>
</header>
<div id="installBar"><span>Instalar como app no telemóvel</span><button id="installBtn">Instalar</button></div>

<div id="loginScreen" style="display:none;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;">
  <div class="card" style="max-width:380px;width:100%;margin-top:6vh;">
    <div style="text-align:center;margin-bottom:18px;">
      <img src="icon-192.png" alt="CPO" style="width:76px;height:76px;border-radius:10px;">
      <h2 style="margin:8px 0 0;font-size:19px;color:var(--accent);">Escala CPO</h2>
      <p style="margin:4px 0 0;font-size:13px;color:var(--muted);">Comando Sub Regional do Douro</p>
      <p class="hint" style="margin-top:4px;">Acesso reservado aos operacionais autorizados</p>
    </div>
    <div id="loginError" style="display:none;background:var(--danger-soft);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;"></div>
    <div id="loginInfo" style="display:none;background:var(--ok-soft);color:var(--ok);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;"></div>
    <label>Email</label>
    <input id="liEmail" type="email" autocomplete="username" placeholder="o.teu@email.pt" style="margin-bottom:12px;">
    <label>Palavra-passe</label>
    <input id="liPass" type="password" autocomplete="current-password" placeholder="••••••••" style="margin-bottom:16px;">
    <button class="btn primary" id="liBtn" style="width:100%;">Entrar</button>
    <p style="text-align:center;margin:14px 0 0;"><a href="#" id="forgotLink" style="font-size:13px;color:var(--accent-ink);">Esqueci-me da palavra-passe</a></p>
    <p class="hint" style="text-align:center;margin-top:14px;">Não tens conta? Pede ao administrador para a criar.</p>
  </div>
</div>

<div class="wrap" id="appBody" style="display:none;">
  <div id="empView"></div>
  <div id="adminView" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>

<footer style="text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px;">
  © JPF-EstadoMaior-2026 — Todos os direitos reservados
</footer>

<script>
/* =============================================================
   CONFIGURAÇÃO FIREBASE — valores copiados do Firebase Console
   ============================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAYGeVwWYxv4y_gcWlatIFO_P_v7yiVLTQ",
  authDomain: "escala-cpo.firebaseapp.com",
  projectId: "escala-cpo",
  storageBucket: "escala-cpo.firebasestorage.app",
  messagingSenderId: "357159211436",
  appId: "1:357159211436:web:d4e92173958d1c405f6a09"
};

const ADMIN_EMAILS = [
  "freitas89@outlook.pt",
  "miguel.fonseca@prociv.pt",
  "jose.requeijo@prociv.pt",
  "celina.martins@prociv.pt",
  "paulapfa41@hotmail.com"
];

/* =============================================================
   Inicialização Firebase (compat SDK — não usar import/require)
   ============================================================= */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const LS="cpo_escala_v1";

let SHARED = false;
let auth = null, db = null;

try {
  if (firebaseConfig.apiKey && firebaseConfig.projectId) {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db   = firebase.firestore();
    SHARED = true;
  }
} catch(e) { SHARED = false; }

function getSecondaryAuth() {
  try {
    return firebase.app("secondary").auth();
  } catch(_) {
    firebase.initializeApp(firebaseConfig, "secondary");
    return firebase.app("secondary").auth();
  }
}

const today = new Date();
const DEFAULT = {
  period: { month: today.getMonth(), year: today.getFullYear() },
  services: [
    { id:"cpo", name:"CPO", turnos:[{ code:"CPO", label:"Turno CPO (22h–22h)" }] }
  ],
  employees: [],
  submissions: []
};

let DB = loadLocal();
function loadLocal(){
  try { const r=localStorage.getItem(LS); return r ? JSON.parse(r) : structuredClone(DEFAULT); }
  catch(e){ return structuredClone(DEFAULT); }
}
function saveLocal(){ localStorage.setItem(LS, JSON.stringify(DB)); }

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }
function daysIn(m,y){ return new Date(y,m+1,0).getDate(); }
function firstDow(m,y){ return new Date(y,m,1).getDay(); }
function uid(){ return Math.random().toString(36).slice(2,9); }

const DOC_ID = "cpo-main";

async function pullShared() {
  if (!SHARED) return;
  try {
    const snap = await db.collection("app_state").doc(DOC_ID).get();
    if (snap.exists) { DB = snap.data(); }
    else { await pushShared(); }
  } catch(e) { toast("Sem ligação ao servidor — modo local."); SHARED = false; }
}
async function pushShared() {
  if (!SHARED) { saveLocal(); return; }
  try { await db.collection("app_state").doc(DOC_ID).set(DB); }
  catch(e) { toast("Falha ao guardar no servidor."); }
}
async function persist() { if (SHARED) { await pushShared(); } else { saveLocal(); } }

let emp = { service:"cpo", name:"", sel:{} };
const empView   = document.getElementById("empView");
const adminView = document.getElementById("adminView");

document.querySelectorAll("#seg button").forEach(b => b.onclick = async () => {
  document.querySelectorAll("#seg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  const v = b.dataset.v;
  empView.style.display   = v==="emp"   ? "block" : "none";
  adminView.style.display = v==="admin" ? "block" : "none";
  if (SHARED) await pullShared();
  if (v==="admin") renderAdmin(); else renderEmp();
});

function statusPill() {
  return SHARED
    ? `<span class="pill live">● Partilhado (todos veem)</span>`
    : `<span class="pill local">● Local (só este dispositivo)</span>`;
}

let SESSION = null, IS_ADMIN = false;
const elLogin    = document.getElementById("loginScreen");
const elHeader   = document.getElementById("appHeader");
const elBody     = document.getElementById("appBody");
const elAdminTab = document.getElementById("adminTab");

function showLoginError(m){ const e=document.getElementById("loginError"); e.textContent=m; e.style.display="block"; document.getElementById("loginInfo").style.display="none"; }
function showLoginInfo(m) { const e=document.getElementById("loginInfo");  e.textContent=m; e.style.display="block"; document.getElementById("loginError").style.display="none"; }

async function enterApp(user) {
  SESSION = user;
  elLogin.style.display  = "none";
  elHeader.style.display = "flex";
  elBody.style.display   = "block";
  IS_ADMIN = ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((user?.email||"").toLowerCase());
  elAdminTab.style.display = IS_ADMIN ? "inline-block" : "none";
  if (!emp.name && user?.displayName) emp.name = user.displayName;
  else if (!emp.name && user?.email)  emp.name = user.email.split("@")[0];
  if (SHARED) await pullShared();
  renderEmp();
}
function showLogin() {
  elHeader.style.display = "none";
  elBody.style.display   = "none";
  elLogin.style.display  = "flex";
}

async function doLogin() {
  const email = document.getElementById("liEmail").value.trim();
  const pass  = document.getElementById("liPass").value;
  if (!email||!pass) { showLoginError("Preenche email e palavra-passe."); return; }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    if (!cred.user.emailVerified) {
      await auth.signOut();
      showLoginError("Confirma primeiro o email que recebeste antes de entrar.");
      return;
    }
  } catch(e) { showLoginError("Email ou palavra-passe incorretos."); }
}
async function doLogout() {
  await auth.signOut();
  SESSION = null; IS_ADMIN = false; emp = {service:"cpo", name:"", sel:{}};
  document.getElementById("liEmail").value = "";
  document.getElementById("liPass").value  = "";
  showLogin();
}
async function doForgot() {
  const email = document.getElementById("liEmail").value.trim();
  if (!email) { showLoginError("Escreve o teu email primeiro."); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showLoginInfo("Enviámos um email para recuperares a palavra-passe.");
  } catch(e) { showLoginError("Não foi possível enviar. Verifica o email."); }
}

document.getElementById("liBtn").onclick    = doLogin;
document.getElementById("liPass").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
document.getElementById("logoutBtn").onclick = doLogout;
document.getElementById("forgotLink").onclick = e => { e.preventDefault(); doForgot(); };

async function createAccount() {
  const hint  = document.getElementById("acHint");
  const nome  = document.getElementById("acNome").value.trim();
  const email = document.getElementById("acEmail").value.trim();
  const pass  = document.getElementById("acPass").value;
  if (!SHARED)       { hint.textContent="Configura primeiro o Firebase para criar contas."; return; }
  if (!nome||!email||!pass) { hint.textContent="Preenche nome, email e palavra-passe."; return; }
  if (pass.length<6) { hint.textContent="A palavra-passe tem de ter pelo menos 6 caracteres."; return; }
  hint.textContent = "A criar conta...";
  try {
    const secAuth = getSecondaryAuth();
    const cred = await secAuth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: nome });
    await cred.user.sendEmailVerification({ url: location.href });
    await secAuth.signOut();
    if (!DB.employees.find(e=>e.name.toLowerCase()===nome.toLowerCase())) {
      DB.employees.push({id:uid(), name:nome, email});
      await persist();
    }
    document.getElementById("acNome").value = "";
    document.getElementById("acEmail").value = "";
    document.getElementById("acPass").value = "";
    hint.textContent = `Conta criada para ${nome}. Enviámos um email de confirmação para ${email}. Entrega-lhe também a palavra-passe inicial.`;
    renderEmpMgr();
  } catch(e) {
    if (/email-already-in-use/.test(e.code)) hint.textContent = "Já existe uma conta com esse email.";
    else hint.textContent = "Erro: " + (e.message||"não foi possível criar.");
  }
}

function renderEmp() {
  if (!DB.services.length) {
    empView.innerHTML=`<div class="card"><p>Ainda não há serviços configurados. Pede ao administrador.</p></div>`;
    return;
  }
  const svc = DB.services.find(s=>s.id===emp.service)||DB.services[0];
  emp.service = svc.id;
  const {month,year} = DB.period;
  const dim=daysIn(month,year), lead=firstDow(month,year);
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const dow=new Date(year,month,d).getDay();
    const we=(dow===0||dow===6)?"weekend":"";
    const cur=emp.sel[d]||[];
    const btns=svc.turnos.map(t=>`<span class="t cpo-btn ${cur.includes(t.code)?'sel':''}" data-d="${d}" data-c="${t.code}" title="${t.label}">${t.code}</span>`).join("");
    cells+=`<div class="day ${we}"><div class="dn">${d}</div>${btns}</div>`;
  }
  const count=Object.values(emp.sel).filter(a=>a&&a.length).length;
  empView.innerHTML=`
    <div class="card">
      <div class="flex sp" style="margin-bottom:14px;">
        <span class="pill">${MESES[month]} ${year}</span>
        ${statusPill()}
      </div>
      <div style="margin-bottom:14px;">
        <label>O teu nome</label>
        <input id="eName" list="empList" placeholder="Escreve ou escolhe o teu nome" value="${emp.name}">
        <datalist id="empList">${DB.employees.map(e=>`<option value="${e.name}">`).join("")}</datalist>
      </div>
      <p class="hint" style="margin-bottom:8px;">Clica nos dias em que estás disponível para o <b>Turno CPO (22h–22h)</b>. Dias marcados ficam com fundo laranja.</p>
      <div class="cal">${DOW.map((d,i)=>`<div class="dow${(i===0||i===6)?' we':''}">${d}</div>`).join("")}</div>
      <div class="cal">${cells}</div>
      <p class="hint" style="margin-top:10px;">${count} dia${count!==1?'s':''} selecionado${count!==1?'s':''}.</p>
      <div class="flex sp" style="margin-top:16px;">
        <button class="btn ghost" id="eClear">Limpar</button>
        <button class="btn primary" id="eSubmit">Submeter disponibilidade</button>
      </div>
    </div>`;
  document.getElementById("eName").oninput = e => emp.name=e.target.value;
  document.getElementById("eClear").onclick = () => { emp.sel={}; renderEmp(); };
  empView.querySelectorAll(".t").forEach(b=>b.onclick=()=>{
    const d=b.dataset.d, c=b.dataset.c;
    emp.sel[d]=emp.sel[d]||[];
    const i=emp.sel[d].indexOf(c);
    if(i>=0) emp.sel[d].splice(i,1); else emp.sel[d].push(c);
    if(!emp.sel[d].length) delete emp.sel[d];
    renderEmp();
  });
  document.getElementById("eSubmit").onclick = submitEmp;
}

async function submitEmp() {
  if (!emp.name.trim()) { toast("Escreve o teu nome primeiro."); return; }
  if (!Object.keys(emp.sel).length) { toast("Marca pelo menos um dia."); return; }
  if (SHARED) await pullShared();
  const name = emp.name.trim();
  if (!DB.employees.find(e=>e.name.toLowerCase()===name.toLowerCase()))
    DB.employees.push({id:uid(), name});
  DB.submissions = DB.submissions.filter(s=>!(
    s.name.toLowerCase()===name.toLowerCase() &&
    s.service===emp.service && s.month===DB.period.month && s.year===DB.period.year
  ));
  DB.submissions.push({id:uid(), name, service:emp.service, month:DB.period.month, year:DB.period.year, sel:structuredClone(emp.sel), at:Date.now()});
  await persist();
  emp.sel={}; renderEmp(); toast("Disponibilidade submetida. Obrigado!");
}

function renderAdmin() {
  const {month,year}=DB.period;
  adminView.innerHTML=`
    <div class="card">
      <div class="flex sp" style="margin-bottom:6px;"><h3 style="margin:0;font-size:15px;">Período da escala</h3>${statusPill()}</div>
      <div class="row grid2">
        <div><label>Mês</label><select id="aMonth">${MESES.map((m,i)=>`<option value="${i}" ${i===month?'selected':''}>${m}</option>`).join("")}</select></div>
        <div><label>Ano</label><input id="aYear" type="number" value="${year}"></div>
      </div>
    </div>
    <div class="card">
      <div class="flex sp"><h3 style="margin:0;font-size:15px;">Serviços e turnos</h3>
        <button class="btn" id="addSvc">+ Novo serviço</button></div>
      <p class="hint">O serviço CPO está pré-configurado. Podes adicionar outros se necessário.</p>
      <div id="svcList" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 4px;font-size:15px;">Gestão de acessos</h3>
      <p class="hint" style="margin-bottom:12px;">Cria a conta de cada operacional. Receberá um email de confirmação — só depois de confirmar consegue entrar.</p>
      <div class="row grid2">
        <div><label>Nome do operacional</label><input id="acNome" placeholder="Nome a mostrar"></div>
        <div><label>Email</label><input id="acEmail" type="email" placeholder="email@exemplo.pt"></div>
      </div>
      <div class="row grid2" style="margin-top:10px;align-items:end;">
        <div><label>Palavra-passe inicial</label><input id="acPass" type="text" placeholder="mín. 6 caracteres"></div>
        <div><button class="btn primary" id="acCreate" style="width:100%;">Criar conta</button></div>
      </div>
      <p class="hint" id="acHint" style="margin-top:10px;"></p>
    </div>
    <div class="card">
      <div class="flex sp"><h3 style="margin:0;font-size:15px;">Operacionais (${DB.employees.length})</h3>
        <button class="btn" id="addEmp">+ Adicionar</button></div>
      <div id="empMgr" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <div class="flex sp"><h3 style="margin:0;font-size:15px;">Submissões (${DB.submissions.length})</h3>
        <div class="flex">
          <button class="btn" id="expXlsx">Exportar .xlsx</button>
          <button class="btn ghost" id="refresh">Atualizar</button>
        </div>
      </div>
      <div id="subList" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <div class="flex"><button class="btn ghost" id="expJson">Backup</button>
        <button class="btn ghost" id="impJson">Importar</button>
        <button class="btn danger" id="resetAll">Repor tudo</button></div>
      <input type="file" id="impFile" accept=".json" style="display:none;">
    </div>`;

  document.getElementById("aMonth").onchange = async e => { DB.period.month=+e.target.value; await persist(); renderAdmin(); };
  document.getElementById("aYear").onchange  = async e => { DB.period.year=+e.target.value;  await persist(); renderAdmin(); };
  document.getElementById("addSvc").onclick  = async () => { DB.services.push({id:uid(),name:"Novo serviço",turnos:[{code:"X",label:"Turno"}]}); await persist(); renderAdmin(); };
  document.getElementById("addEmp").onclick  = async () => { const n=prompt("Nome do operacional:"); if(n&&n.trim()){DB.employees.push({id:uid(),name:n.trim()}); await persist(); renderAdmin();} };
  document.getElementById("acCreate").onclick = createAccount;
  document.getElementById("expXlsx").onclick  = exportXlsx;
  document.getElementById("refresh").onclick  = async () => { if(SHARED) await pullShared(); renderAdmin(); toast("Atualizado."); };
  document.getElementById("expJson").onclick  = exportJson;
  document.getElementById("impJson").onclick  = () => document.getElementById("impFile").click();
  document.getElementById("impFile").onchange = importJson;
  document.getElementById("resetAll").onclick = async () => { if(confirm("Apagar todos os dados?")){ DB=structuredClone(DEFAULT); await persist(); renderAdmin(); } };
  renderSvcList(); renderEmpMgr(); renderSubList();
}

function renderSvcList() {
  const el=document.getElementById("svcList");
  el.innerHTML=DB.services.map(s=>`
    <div class="svc-edit" data-s="${s.id}">
      <div class="flex sp" style="margin-bottom:8px;">
        <input class="svcName" data-s="${s.id}" value="${s.name}" style="max-width:320px;">
        <button class="btn danger delSvc" data-s="${s.id}">Apagar</button>
      </div>
      <div class="flex">
        ${s.turnos.map(t=>`<span class="turno-tag"><b>${t.code}</b> ${t.label}<button class="delT" data-s="${s.id}" data-c="${t.code}" title="remover">×</button></span>`).join("")}
        <button class="btn ghost addT" data-s="${s.id}" style="padding:5px 11px;">+ turno</button>
      </div>
    </div>`).join("")||`<p class="hint">Sem serviços.</p>`;
  el.querySelectorAll(".svcName").forEach(i=>i.onchange=async e=>{DB.services.find(s=>s.id===e.target.dataset.s).name=e.target.value.trim()||"Serviço"; await persist();});
  el.querySelectorAll(".delSvc").forEach(b=>b.onclick=async()=>{if(confirm("Apagar este serviço?")){DB.services=DB.services.filter(s=>s.id!==b.dataset.s); await persist(); renderAdmin();}});
  el.querySelectorAll(".delT").forEach(b=>b.onclick=async()=>{const s=DB.services.find(x=>x.id===b.dataset.s); s.turnos=s.turnos.filter(t=>t.code!==b.dataset.c); await persist(); renderSvcList();});
  el.querySelectorAll(".addT").forEach(b=>b.onclick=async()=>{const code=prompt("Código do turno:"); if(!code)return; const label=prompt("Descrição:")||code; const s=DB.services.find(x=>x.id===b.dataset.s); s.turnos.push({code:code.trim(),label:label.trim()}); await persist(); renderSvcList();});
}
function renderEmpMgr() {
  const el=document.getElementById("empMgr");
  if(!DB.employees.length){el.innerHTML=`<p class="hint">Ainda sem operacionais.</p>`;return;}
  el.innerHTML=`<div class="flex">${DB.employees.map(e=>`<span class="turno-tag">${e.name}<button class="delE" data-e="${e.id}">×</button></span>`).join("")}</div>`;
  el.querySelectorAll(".delE").forEach(b=>b.onclick=async()=>{DB.employees=DB.employees.filter(e=>e.id!==b.dataset.e); await persist(); renderEmpMgr();});
}
function renderSubList() {
  const el=document.getElementById("subList");
  const subs=DB.submissions.filter(s=>s.month===DB.period.month&&s.year===DB.period.year);
  if(!subs.length){el.innerHTML=`<p class="hint">Sem submissões para ${MESES[DB.period.month]} ${DB.period.year}.</p>`;return;}
  el.innerHTML=`<div style="overflow-x:auto;"><table><thead><tr><th>Nome</th><th>Serviço</th><th>Dias disponíveis</th><th></th></tr></thead><tbody>
    ${subs.map(s=>{
      const svc=DB.services.find(x=>x.id===s.service);
      const days=Object.entries(s.sel).sort((a,b)=>+a[0]-+b[0]).map(([d])=>`<span class="tag">${d}</span>`).join("");
      return `<tr><td>${s.name}</td><td>${svc?svc.name:s.service}</td><td>${days}</td><td><button class="btn ghost delSub" data-id="${s.id}" style="padding:5px 9px;color:var(--danger);">apagar</button></td></tr>`;
    }).join("")}
  </tbody></table></div>`;
  el.querySelectorAll(".delSub").forEach(b=>b.onclick=async()=>{DB.submissions=DB.submissions.filter(s=>s.id!==b.dataset.id); await persist(); renderSubList();});
}

function exportXlsx(){
  const {month,year}=DB.period;
  const dim=daysIn(month,year);
  const dayCols=[];
  for(let d=1;d<=dim;d++){const dow=new Date(year,month,d).getDay(); dayCols.push(`${d}${(dow===0||dow===6)?" - "+(dow===0?"D":"S"):""}`);}
  const wb=XLSX.utils.book_new();
  const usedNames=[];
  DB.services.forEach(svc=>{
    const subs=DB.submissions.filter(s=>s.service===svc.id&&s.month===month&&s.year===year);
    const rows=[["Nº","Nome","Obs.",...dayCols]];
    subs.forEach((s,i)=>{const row=[i+1,s.name,""]; for(let d=1;d<=dim;d++){const a=s.sel[d]; row.push(a&&a.length?"✓":"");} rows.push(row);});
    if(!subs.length) rows.push(["","(sem submissões)","",...Array(dim).fill("")]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:5},{wch:24},{wch:8},...Array(dim).fill({wch:5})];
    let nm=svc.name.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)||"Serviço";
    let base=nm,k=2; while(usedNames.includes(nm)){nm=(base.slice(0,28)+"_"+k).slice(0,31);k++;}
    usedNames.push(nm); XLSX.utils.book_append_sheet(wb,ws,nm);
  });
  const leg=[["Serviço","Código","Significado"]];
  DB.services.forEach(s=>s.turnos.forEach(t=>leg.push([s.name,t.code,t.label])));
  const wsl=XLSX.utils.aoa_to_sheet(leg); wsl["!cols"]=[{wch:20},{wch:10},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsl,"Legenda");
  XLSX.writeFile(wb,`EscalaCPO_Apanhado_${MESES[month]}_${year}.xlsx`);
  toast("Ficheiro .xlsx gerado.");
}
function exportJson(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`backup_cpo_${MESES[DB.period.month]}_${DB.period.year}.json`; a.click();
}
function importJson(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);
    if(confirm("Importar substitui os dados atuais. Continuar?")){DB=d; await persist(); renderAdmin(); toast("Dados importados.");}
  }catch(err){toast("Ficheiro inválido.");}};
  r.readAsText(f); e.target.value="";
}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBar").style.display="flex";});
document.getElementById("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBar").style.display="none";};
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw-cpo.js?v=1").catch(()=>{}));
}

  if (SHARED) {
    auth.onAuthStateChanged(async user => {
      if (user && user.emailVerified) { await enterApp(user); }
      else { showLogin(); }
    });
  } else {
    elHeader.style.display = "flex";
    elBody.style.display   = "block";
    elLogin.style.display  = "none";
    elAdminTab.style.display = "inline-block";
    renderEmp();
  }
})();
