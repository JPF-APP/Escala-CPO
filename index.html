<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C25A0C">
<title>Escala CPO — Comando Sub Regional do Douro</title>
<link rel="manifest" href="manifest-cpo.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala CPO">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FFF8F2;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#F0CCA8;
    --accent:#C25A0C;--accent-soft:#FDEBD8;--accent-ink:#7D3408;
    --ok:#0F6E56;--ok-soft:#E1F5EE;--danger:#A32D2D;--danger-soft:#FCEBEB;
    --weekend-bg:#FFF3E0;--weekend-border:#FFCC80;--weekend-num:#B07000;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:env(safe-area-inset-bottom);}
  header{background:var(--accent);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;font-weight:600;margin:0;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:transparent;color:#fff;padding:8px 14px;font-size:14px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--accent);font-weight:600;}
  /* sub-tabs admin */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
  .subtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;}
  button.btn{padding:11px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;}
  button.btn:hover{background:#f0f2f5;}
  button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.btn.ghost{background:transparent;}
  button.btn.sm{padding:5px 10px;font-size:12px;}
  button.btn.danger{color:var(--danger);border-color:var(--danger-soft);}
  .row{display:grid;gap:12px;}
  .grid2{grid-template-columns:1fr 1fr;}
  .grid3{grid-template-columns:1fr 1fr 1fr;}
  .pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);}
  .pill.live{background:var(--ok-soft);color:var(--ok);}
  .pill.local{background:#fdecdc;color:#854F0B;}
  .dow{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;}
  .dow.we{color:var(--weekend-num);font-weight:600;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px;}
  .day{border:1px solid var(--line);border-radius:8px;padding:5px;min-height:60px;background:#fff;}
  .day.empty{border:none;background:transparent;}
  .day.weekend{background:var(--weekend-bg);border-color:var(--weekend-border);}
  .day.weekend .dn{color:var(--weekend-num);font-weight:600;}
  .dn{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .t{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:1px 1px 0 0;display:inline-block;}
  .t.sel{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .t.cpo-btn{width:100%;text-align:center;padding:4px 0;font-size:12px;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{background:#f7f8fa;color:var(--muted);font-weight:600;}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef1f5;margin:0 4px 4px 0;display:inline-block;}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;
    transition:opacity .25s;pointer-events:none;z-index:99;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0;}
  .svc-edit{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .turno-tag{display:inline-flex;align-items:center;gap:6px;background:#eef1f5;border-radius:6px;padding:4px 9px;font-size:12px;margin:0 6px 6px 0;}
  .turno-tag button{border:none;background:none;cursor:pointer;color:var(--danger);font-size:15px;line-height:1;}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sp{justify-content:space-between;}
  /* Escala builder */
  .escala-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;}
  .escala-day{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-height:90px;}
  .escala-day.we{background:var(--weekend-bg);border-color:var(--weekend-border);}
  .escala-day-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .escala-day-num{font-weight:700;font-size:14px;color:var(--accent-ink);}
  .escala-day-dow{font-size:11px;color:var(--muted);}
  .escala-person{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);
    border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:12px;gap:4px;}
  .escala-person span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .escala-person button{border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;padding:0;line-height:1;flex-shrink:0;}
  .escala-add{margin-top:4px;}
  .escala-add select{padding:4px 6px;font-size:12px;border-radius:6px;border:1px dashed var(--line);}
  #installBar{display:none;background:var(--accent-soft);color:var(--accent-ink);padding:10px 16px;
    text-align:center;font-size:14px;align-items:center;justify-content:center;gap:10px;}
  #installBar button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;}
  @media(max-width:640px){
    .grid2,.grid3{grid-template-columns:1fr;}
    .cal{gap:3px;}.day{min-height:54px;padding:4px;}
    .escala-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  }
</style>
</head>
<body>
<header id="appHeader" style="display:none;">
  <h1>Escala CPO</h1>
  <div class="flex" style="gap:10px;">
    <div class="seg" id="seg">
      <button class="on" data-v="emp">Operacionais</button>
      <button data-v="admin" id="adminTab" style="display:none;">Administrador</button>
    </div>
    <button id="logoutBtn" class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4);padding:7px 12px;">Sair</button>
  </div>
</header>
<div id="installBar"><span>Instalar como app no telemóvel</span><button id="installBtn">Instalar</button></div>

<div id="loginScreen" style="display:none;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;">
  <div class="card" style="max-width:380px;width:100%;margin-top:6vh;">
    <div style="text-align:center;margin-bottom:18px;">
      <h2 style="margin:8px 0 0;font-size:19px;color:var(--accent);">Escala CPO</h2>
      <p style="margin:4px 0 0;font-size:13px;color:var(--muted);">Comando Sub Regional do Douro</p>
      <p class="hint" style="margin-top:4px;">Acesso reservado aos operacionais autorizados</p>
    </div>
    <div id="loginError" style="display:none;background:var(--danger-soft);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;"></div>
    <div id="loginInfo" style="display:none;background:var(--ok-soft);color:var(--ok);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;"></div>
    <label>Email</label>
    <input id="liEmail" type="email" autocomplete="username" placeholder="o.teu@email.pt" style="margin-bottom:12px;">
    <label>Palavra-passe</label>
    <input id="liPass" type="password" autocomplete="current-password" placeholder="••••••••" style="margin-bottom:16px;">
    <button class="btn primary" id="liBtn" style="width:100%;">Entrar</button>
    <p style="text-align:center;margin:14px 0 0;"><a href="#" id="forgotLink" style="font-size:13px;color:var(--accent-ink);">Esqueci-me da palavra-passe</a></p>
    <p class="hint" style="text-align:center;margin-top:14px;">Não tens conta? Pede ao administrador para a criar.</p>
  </div>
</div>

<div class="wrap" id="appBody" style="display:none;">
  <div id="empView"></div>
  <div id="adminView" style="display:none;"></div>
</div>
<div class="toast" id="toast"></div>

<footer style="text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px;">
  © Núcleo de Apoio às Operações-CSREPC Douro — 2026 — Todos os Direitos Reservados
</footer>

<script>
/* ============================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAYGeVwWYxv4y_gcWlatIFO_P_v7yiVLTQ",
  authDomain: "escala-cpo.firebaseapp.com",
  projectId: "escala-cpo",
  storageBucket: "escala-cpo.firebasestorage.app",
  messagingSenderId: "357159211436",
  appId: "1:357159211436:web:d4e92173958d1c405f6a09"
};
const ADMIN_EMAILS = [
  "freitas89@outlook.pt",
  "miguel.fonseca@prociv.pt",
  "jose.requeijo@prociv.pt",
  "celina.martins@prociv.pt",
  "paulapfa41@hotmail.com"
];
/* ============================================================= */

const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW_FULL=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const LS="cpo_escala_v2";

let SHARED=false, auth=null, db=null;
try {
  if(firebaseConfig.apiKey&&firebaseConfig.projectId){
    firebase.initializeApp(firebaseConfig);
    auth=firebase.auth(); db=firebase.firestore(); SHARED=true;
  }
} catch(e){SHARED=false;}

function getSecondaryAuth(){
  try{return firebase.app("secondary").auth();}
  catch(_){firebase.initializeApp(firebaseConfig,"secondary");return firebase.app("secondary").auth();}
}

const today=new Date();
const DEFAULT={
  period:{month:today.getMonth(),year:today.getFullYear()},
  services:[{id:"cpo",name:"CPO",turnos:[{code:"CPO",label:"Turno CPO (22h–22h)"}]}],
  employees:[],
  submissions:[],
  schedule:{}   // {dayNum: [{name, num, corpo}]}
};

let DB=loadLocal();
function loadLocal(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):structuredClone(DEFAULT);}catch(e){return structuredClone(DEFAULT);}}
function saveLocal(){localStorage.setItem(LS,JSON.stringify(DB));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);}
function daysIn(m,y){return new Date(y,m+1,0).getDate();}
function firstDow(m,y){return new Date(y,m,1).getDay();}
function uid(){return Math.random().toString(36).slice(2,9);}

const DOC_ID="cpo-main";
async function pullShared(){
  if(!SHARED)return;
  try{const snap=await db.collection("app_state").doc(DOC_ID).get();
    if(snap.exists){DB=snap.data();if(!DB.schedule)DB.schedule={};}
    else{await pushShared();}
  }catch(e){toast("Sem ligação ao servidor — modo local.");SHARED=false;}
}
async function pushShared(){
  if(!SHARED){saveLocal();return;}
  try{await db.collection("app_state").doc(DOC_ID).set(DB);}
  catch(e){toast("Falha ao guardar no servidor.");}
}
async function persist(){if(SHARED){await pushShared();}else{saveLocal();}}

let emp={service:"cpo",name:"",num:"",corpo:"",categoria:"",obs:"",sel:{}};
let adminSubTab="submissoes";
const empView=document.getElementById("empView");
const adminView=document.getElementById("adminView");

document.querySelectorAll("#seg button").forEach(b=>b.onclick=async()=>{
  document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const v=b.dataset.v;
  empView.style.display=v==="emp"?"block":"none";
  adminView.style.display=v==="admin"?"block":"none";
  if(SHARED)await pullShared();
  if(v==="admin")renderAdmin();else renderEmp();
});

function statusPill(){
  return SHARED
    ?`<span class="pill live">● Partilhado</span>`
    :`<span class="pill local">● Local</span>`;
}

/* ---- AUTH ---- */
let SESSION=null,IS_ADMIN=false;
const elLogin=document.getElementById("loginScreen");
const elHeader=document.getElementById("appHeader");
const elBody=document.getElementById("appBody");
const elAdminTab=document.getElementById("adminTab");

function showLoginError(m){const e=document.getElementById("loginError");e.textContent=m;e.style.display="block";document.getElementById("loginInfo").style.display="none";}
function showLoginInfo(m){const e=document.getElementById("loginInfo");e.textContent=m;e.style.display="block";document.getElementById("loginError").style.display="none";}

async function enterApp(user){
  SESSION=user;
  elLogin.style.display="none";elHeader.style.display="flex";elBody.style.display="block";
  IS_ADMIN=ADMIN_EMAILS.map(x=>x.toLowerCase()).includes((user?.email||"").toLowerCase());
  elAdminTab.style.display=IS_ADMIN?"inline-block":"none";
  if(!emp.name&&user?.displayName)emp.name=user.displayName;
  else if(!emp.name&&user?.email)emp.name=user.email.split("@")[0];
  if(SHARED)await pullShared();
  renderEmp();
}
function showLogin(){elHeader.style.display="none";elBody.style.display="none";elLogin.style.display="flex";}

async function doLogin(){
  const email=document.getElementById("liEmail").value.trim();
  const pass=document.getElementById("liPass").value;
  if(!email||!pass){showLoginError("Preenche email e palavra-passe.");return;}
  try{await auth.signInWithEmailAndPassword(email,pass);}
  catch(e){showLoginError("Email ou palavra-passe incorretos.");}
}
async function doLogout(){
  await auth.signOut();
  SESSION=null;IS_ADMIN=false;emp={service:"cpo",name:"",num:"",corpo:"",categoria:"",obs:"",sel:{}};
  document.getElementById("liEmail").value="";document.getElementById("liPass").value="";
  showLogin();
}
async function doForgot(){
  const email=document.getElementById("liEmail").value.trim();
  if(!email){showLoginError("Escreve o teu email primeiro.");return;}
  try{await auth.sendPasswordResetEmail(email);showLoginInfo("Enviámos um email para recuperares a palavra-passe.");}
  catch(e){showLoginError("Não foi possível enviar. Verifica o email.");}
}
document.getElementById("liBtn").onclick=doLogin;
document.getElementById("liPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("logoutBtn").onclick=doLogout;
document.getElementById("forgotLink").onclick=e=>{e.preventDefault();doForgot();};

async function createAccount(){
  const hint=document.getElementById("acHint");
  const nome=document.getElementById("acNome").value.trim();
  const email=document.getElementById("acEmail").value.trim();
  const pass=document.getElementById("acPass").value;
  if(!SHARED){hint.textContent="Configura primeiro o Firebase para criar contas.";return;}
  if(!nome||!email||!pass){hint.textContent="Preenche nome, email e palavra-passe.";return;}
  if(pass.length<6){hint.textContent="A palavra-passe tem de ter pelo menos 6 caracteres.";return;}
  hint.textContent="A criar conta...";
  try{
    const secAuth=getSecondaryAuth();
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    await cred.user.updateProfile({displayName:nome});
    await secAuth.signOut();
    if(!DB.employees.find(e=>e.name.toLowerCase()===nome.toLowerCase())){
      DB.employees.push({id:uid(),name:nome,email});await persist();
    }
    document.getElementById("acNome").value="";
    document.getElementById("acEmail").value="";
    document.getElementById("acPass").value="";
    hint.textContent=`Conta criada para ${nome}. Entrega-lhe o email (${email}) e a palavra-passe inicial.`;
    renderEmpMgr();
  }catch(e){
    if(/email-already-in-use/.test(e.code))hint.textContent="Já existe uma conta com esse email.";
    else hint.textContent="Erro: "+(e.message||"não foi possível criar.");
  }
}

/* ============================================================
   VISTA OPERACIONAIS
   ============================================================ */
function renderEmp(){
  if(!DB.services.length){empView.innerHTML=`<div class="card"><p>Ainda não há serviços configurados.</p></div>`;return;}
  const svc=DB.services.find(s=>s.id===emp.service)||DB.services[0];
  emp.service=svc.id;
  const {month,year}=DB.period;
  const dim=daysIn(month,year),lead=firstDow(month,year);
  let cells="";
  for(let i=0;i<lead;i++)cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const dow=new Date(year,month,d).getDay();
    const we=(dow===0||dow===6)?"weekend":"";
    const cur=emp.sel[d]||[];
    const btns=svc.turnos.map(t=>`<span class="t cpo-btn ${cur.includes(t.code)?'sel':''}" data-d="${d}" data-c="${t.code}" title="${t.label}">${t.code}</span>`).join("");
    cells+=`<div class="day ${we}"><div class="dn">${d}</div>${btns}</div>`;
  }
  const count=Object.values(emp.sel).filter(a=>a&&a.length).length;
  empView.innerHTML=`
    <div class="card">
      <div class="flex sp" style="margin-bottom:14px;">
        <span class="pill">${MESES[month]} ${year}</span>${statusPill()}
      </div>
      <div class="row grid2" style="margin-bottom:12px;">
        <div>
          <label>Nome completo</label>
          <input id="eName" name="nome" list="empList" autocomplete="name" placeholder="" value="${emp.name}">
          <datalist id="empList">${DB.employees.map(e=>`<option value="${e.name}">`).join("")}</datalist>
        </div>
        <div>
          <label>Nº Mecanográfico</label>
          <input id="eNum" name="num_mecanografico" type="text" autocomplete="on" placeholder="" value="${emp.num}">
        </div>
      </div>
      <div class="row grid2" style="margin-bottom:14px;">
        <div>
          <label>Corpo de Bombeiros</label>
          <input id="eCorpo" name="corpo_bombeiros" type="text" autocomplete="organization" placeholder="" value="${emp.corpo}">
        </div>
        <div>
          <label>Categoria</label>
          <select id="eCategoria">
            <option value="" ${!emp.categoria?'selected':''}>-- Seleciona --</option>
            <option value="Comandante" ${emp.categoria==='Comandante'?'selected':''}>Comandante</option>
            <option value="2º Comandante" ${emp.categoria==='2º Comandante'?'selected':''}>2º Comandante</option>
            <option value="Adjunto de Comando" ${emp.categoria==='Adjunto de Comando'?'selected':''}>Adjunto de Comando</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:14px;">
        <label>Observações <span style="font-weight:400;color:var(--muted)">(opcional)</span></label>
        <input id="eObs" name="observacoes" type="text" autocomplete="on" placeholder="" value="${emp.obs||''}">
      </div>
      <p class="hint" style="margin-bottom:8px;">Clica nos dias em que estás disponível para o <b>Turno CPO (22h–22h)</b>.</p>
      <div class="cal">${DOW.map((d,i)=>`<div class="dow${(i===0||i===6)?' we':''}">${d}</div>`).join("")}</div>
      <div class="cal">${cells}</div>
      <p class="hint" style="margin-top:10px;">${count} dia${count!==1?'s':''} selecionado${count!==1?'s':''}.</p>
      <div class="flex sp" style="margin-top:16px;">
        <button class="btn ghost" id="eClear">Limpar</button>
        <button class="btn primary" id="eSubmit">Submeter disponibilidade</button>
      </div>
    </div>
    <div class="card" style="margin-top:4px;">
      <div class="flex sp" id="passToggleHd" style="cursor:pointer;" onclick="document.getElementById('passForm').style.display=document.getElementById('passForm').style.display==='none'?'block':'none'">
        <h3 style="margin:0;font-size:14px;color:var(--muted);font-weight:500;">🔒 Alterar palavra-passe</h3>
        <span style="font-size:12px;color:var(--muted);">▾</span>
      </div>
      <div id="passForm" style="display:none;margin-top:14px;">
        <div style="margin-bottom:10px;">
          <label>Palavra-passe atual</label>
          <input id="passAtual" type="password" placeholder="A tua palavra-passe atual">
        </div>
        <div style="margin-bottom:10px;">
          <label>Nova palavra-passe</label>
          <input id="passNova" type="password" placeholder="Mínimo 6 caracteres">
        </div>
        <div style="margin-bottom:14px;">
          <label>Confirmar nova palavra-passe</label>

        </div>
        <div id="passMsg" style="display:none;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;"></div>
        <button class="btn primary" id="passBtn" style="width:100%;">Alterar palavra-passe</button>
      </div>
    </div>`;
  document.getElementById("eName").oninput=e=>emp.name=e.target.value;
  document.getElementById("eNum").oninput=e=>emp.num=e.target.value;
  document.getElementById("eCorpo").oninput=e=>emp.corpo=e.target.value;
  document.getElementById("eCategoria").onchange=e=>emp.categoria=e.target.value;
  document.getElementById("eObs").oninput=e=>emp.obs=e.target.value;

  empView.querySelectorAll(".t").forEach(b=>b.onclick=()=>{
    const d=b.dataset.d,c=b.dataset.c;
    emp.sel[d]=emp.sel[d]||[];
    const i=emp.sel[d].indexOf(c);
    if(i>=0)emp.sel[d].splice(i,1);else emp.sel[d].push(c);
    if(!emp.sel[d].length)delete emp.sel[d];
    renderEmp();
  });
  document.getElementById("eSubmit").onclick=submitEmp;

async function alterarPassword(){
  const atual  = document.getElementById("passAtual").value;
  const nova   = document.getElementById("passNova").value;
  const conf   = document.getElementById("passConfirm").value;
  const msg    = document.getElementById("passMsg");
  function showMsg(texto,ok){
    msg.textContent=texto;msg.style.display="block";
    msg.style.background=ok?"var(--ok-soft)":"var(--danger-soft)";
    msg.style.color=ok?"var(--ok)":"var(--danger)";
  }
  if(!atual||!nova||!conf){showMsg("Preenche todos os campos.",false);return;}
  if(nova.length<6){showMsg("A nova palavra-passe tem de ter pelo menos 6 caracteres.",false);return;}
  if(nova!==conf){showMsg("A confirmação não coincide com a nova palavra-passe.",false);return;}
  if(nova===atual){showMsg("A nova palavra-passe tem de ser diferente da atual.",false);return;}
  try{
    const user=auth.currentUser;
    const cred=firebase.auth.EmailAuthProvider.credential(user.email,atual);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(nova);
    showMsg("Palavra-passe alterada com sucesso!",true);
    document.getElementById("passAtual").value="";
    document.getElementById("passNova").value="";
    document.getElementById("passConfirm").value="";
  }catch(e){
    if(/wrong-password|invalid-credential/.test(e.code))showMsg("A palavra-passe atual está incorreta.",false);
    else if(/requires-recent-login/.test(e.code))showMsg("Por segurança, sai e volta a entrar antes de alterar.",false);
    else showMsg("Erro: "+(e.message||"não foi possível alterar."),false);
  }
}

async function submitEmp(){
  if(!emp.name.trim()){toast("Escreve o teu nome primeiro.");return;}
  if(!emp.num.trim()){toast("Indica o teu Nº Mecanográfico.");return;}
  if(!emp.corpo.trim()){toast("Indica o teu Corpo de Bombeiros.");return;}
  if(!emp.categoria){toast("Seleciona a tua Categoria.");return;}
  if(!Object.keys(emp.sel).length){toast("Marca pelo menos um dia.");return;}
  if(SHARED)await pullShared();
  const name=emp.name.trim(),num=emp.num.trim(),corpo=emp.corpo.trim(),categoria=emp.categoria,obs=(emp.obs||"").trim();
  if(!DB.employees.find(e=>e.name.toLowerCase()===name.toLowerCase()))
    DB.employees.push({id:uid(),name,num,corpo,categoria});
  DB.submissions=DB.submissions.filter(s=>!(
    s.name.toLowerCase()===name.toLowerCase()&&
    s.service===emp.service&&s.month===DB.period.month&&s.year===DB.period.year
  ));
  DB.submissions.push({id:uid(),name,num,corpo,categoria,obs,service:emp.service,month:DB.period.month,year:DB.period.year,sel:structuredClone(emp.sel),at:Date.now()});
  await persist();
  emp.sel={};emp.categoria="";emp.obs="";renderEmp();toast("Disponibilidade submetida. Obrigado!");
}

/* ---------- Sub: Escala ---------- */
function renderEscalaTab(){
  const sub=document.getElementById("adminSub");
  const {month,year}=DB.period;
  if(!DB.schedule)DB.schedule={};
  const dim=daysIn(month,year);
  // Recolher todos os nomes disponíveis das submissões do mês
  const subs=DB.submissions.filter(s=>s.month===month&&s.year===year);

  let grid="";
  for(let d=1;d<=dim;d++){
    const dow=new Date(year,month,d).getDay();
    const we=(dow===0||dow===6)?"we":"";
    const key=String(d);
    const agendados=DB.schedule[key]||[];
    // pessoas disponíveis neste dia (das submissões) que ainda não estão agendadas
    const dispNesteDia=subs.filter(s=>{
      const sel=s.sel||{};
      return Object.keys(sel).includes(key);
    });
    const todosOsNomes=[...new Set([
      ...DB.employees.map(e=>e.name),
      ...subs.map(s=>s.name)
    ])].filter(n=>!agendados.find(a=>a.name===n));

    const pessoasHTML=agendados.map((p,i)=>{
      const info=p.num?` (${p.num})`:'';
      return `<div class="escala-person">
        <span title="${p.corpo||''}">${p.name}${info}</span>
        <button class="mv-btn" data-d="${d}" data-i="${i}" title="Mover para outro dia">⇄</button>
        <button class="rm-btn" data-d="${d}" data-i="${i}">×</button>
      </div>`;
    }).join("");

    const addOpts=todosOsNomes.map(n=>{
      const sub=subs.find(s=>s.name===n);
      const disp=dispNesteDia.find(s=>s.name===n);
      return `<option value="${n}" data-num="${sub?.num||''}" data-corpo="${sub?.corpo||''}" data-categoria="${sub?.categoria||''}">${n}${disp?' ✓':''}${sub?.num?' ('+sub.num+')':''}</option>`;
    }).join("");

    grid+=`<div class="escala-day ${we}">
      <div class="escala-day-hd">
        <span class="escala-day-num">${d}</span>
        <span class="escala-day-dow">${DOW[dow]}</span>
      </div>
      ${pessoasHTML}
      ${addOpts?`<div class="escala-add">
        <select class="add-sel" data-d="${d}" style="width:100%;padding:4px;font-size:12px;border-radius:6px;border:1px dashed var(--line);">
          <option value="">+ adicionar</option>${addOpts}
        </select>
      </div>`:'<p style="font-size:11px;color:var(--muted);margin:4px 0 0;">Todos adicionados</p>'}
    </div>`;
  }

  sub.innerHTML=`
    <div class="card">
      <div class="flex sp" style="margin-bottom:4px;">
        <h3 style="margin:0;font-size:15px;">Escala — ${MESES[month]} ${year}</h3>
        <button class="btn sm primary" id="expEscala">Exportar .xlsx</button>
      </div>
      <p class="hint" style="margin-bottom:12px;">✓ = pessoa com disponibilidade declarada neste dia. Podes adicionar qualquer elemento independentemente.</p>
      <div class="escala-grid">${grid}</div>
    </div>`;

  // Remover
  sub.querySelectorAll(".rm-btn").forEach(b=>b.onclick=async()=>{
    const d=b.dataset.d,i=+b.dataset.i;
    if(!DB.schedule[d])return;
    DB.schedule[d].splice(i,1);
    if(!DB.schedule[d].length)delete DB.schedule[d];
    await persist();renderEscalaTab();
  });

  // Mover
  sub.querySelectorAll(".mv-btn").forEach(b=>b.onclick=async()=>{
    const d=b.dataset.d,i=+b.dataset.i;
    const pessoa=DB.schedule[d]?.[i];
    if(!pessoa)return;
    const dest=prompt(`Mover "${pessoa.name}" para o dia:`);
    if(!dest||isNaN(+dest)||+dest<1||+dest>dim){toast("Dia inválido.");return;}
    const destKey=String(+dest);
    DB.schedule[d].splice(i,1);
    if(!DB.schedule[d].length)delete DB.schedule[d];
    if(!DB.schedule[destKey])DB.schedule[destKey]=[];
    if(!DB.schedule[destKey].find(p=>p.name===pessoa.name))
      DB.schedule[destKey].push(pessoa);
    await persist();renderEscalaTab();
  });

  // Adicionar
  sub.querySelectorAll(".add-sel").forEach(sel=>sel.onchange=async e=>{
    const nome=e.target.value;if(!nome)return;
    const d=sel.dataset.d;
    const opt=e.target.selectedOptions[0];
    const num=opt.dataset.num||'';
    const corpo=opt.dataset.corpo||'';
    const categoria=opt.dataset.categoria||'';
    if(!DB.schedule[d])DB.schedule[d]=[];
    if(!DB.schedule[d].find(p=>p.name===nome))
      DB.schedule[d].push({name:nome,num,corpo,categoria});
    await persist();renderEscalaTab();
  });

  document.getElementById("expEscala").onclick=exportEscala;
}

function downloadTemplate(){

async function importXlsxContas(e){
  const f=e.target.files[0];if(!f)return;
  e.target.value="";
  const progress=document.getElementById("impProgress");
  const bar=document.getElementById("impBar");
  const status=document.getElementById("impStatus");
  progress.style.display="block";
  bar.style.width="0%";
  status.textContent="A ler o ficheiro...";

  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      if(!rows.length){status.textContent="Ficheiro vazio.";return;}

      // Detectar se 1ª linha é cabeçalho
      const first=rows[0].map(c=>String(c).toLowerCase());
      const hasHeader=first.includes("nome")||first.includes("email")||first.includes("password");
      const data=hasHeader?rows.slice(1):rows;
      const validas=data.filter(r=>r[0]&&r[1]&&r[2]&&String(r[1]).includes("@"));

      if(!validas.length){status.textContent="Nenhuma linha válida encontrada. Verifica as colunas Nome, Email, Password.";return;}

      status.textContent=`A criar ${validas.length} conta(s)...`;
      let ok=0,erros=[];
      for(let i=0;i<validas.length;i++){
        const nome=String(validas[i][0]).trim();
        const email=String(validas[i][1]).trim();
        const pass=String(validas[i][2]).trim();
        bar.style.width=Math.round(((i+1)/validas.length)*100)+"%";
        status.textContent=`A criar conta ${i+1} de ${validas.length}: ${nome}...`;
        if(pass.length<6){erros.push(`${nome}: password demasiado curta (mín. 6 caracteres)`);continue;}
        try{
          const secAuth=getSecondaryAuth();
          const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
          await cred.user.updateProfile({displayName:nome});
          await secAuth.signOut();
          if(!DB.employees.find(x=>x.name.toLowerCase()===nome.toLowerCase()))
            DB.employees.push({id:uid(),name:nome,email});
          ok++;
        }catch(err){
          if(/email-already-in-use/.test(err.code))erros.push(`${nome}: email já existe`);
          else erros.push(`${nome}: ${err.message}`);
        }
      }
      await persist();
      bar.style.width="100%";
      let msg=`✓ ${ok} conta(s) criada(s) com sucesso.`;
      if(erros.length)msg+=` ${erros.length} erro(s): ${erros.join(" | ")}`;
      status.textContent=msg;
      renderEmpMgr();
    }catch(err){status.textContent="Erro ao ler o ficheiro: "+err.message;}
  };
  reader.readAsArrayBuffer(f);
}

function exportXlsx(){
  const {month,year}=DB.period;
  const dim=daysIn(month,year);
  const dayCols=[];
  for(let d=1;d<=dim;d++){const dow=new Date(year,month,d).getDay();dayCols.push(`${d}${(dow===0||dow===6)?" - "+(dow===0?"D":"S"):""}`);}
  const wb=XLSX.utils.book_new();
  const usedNames=[];
  DB.services.forEach(svc=>{
    const subs=DB.submissions.filter(s=>s.service===svc.id&&s.month===month&&s.year===year);
    const rows=[["Nº","Nome","Nº Mec.","Corpo","Categoria","Observações",...dayCols]];
    subs.forEach((s,i)=>{
      const row=[i+1,s.name,s.num||'',s.corpo||'',s.categoria||'',s.obs||''];
      for(let d=1;d<=dim;d++){const a=s.sel[d];row.push(a&&a.length?"✓":"");}
      rows.push(row);
    });
    if(!subs.length)rows.push(['','(sem submissões)','','','',...Array(dim).fill('')]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:4},{wch:24},{wch:10},{wch:28},{wch:8},...Array(dim).fill({wch:5})];
    let nm=svc.name.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31)||"Serviço";
    let base=nm,k=2;while(usedNames.includes(nm)){nm=(base.slice(0,28)+"_"+k).slice(0,31);k++;}
    usedNames.push(nm);XLSX.utils.book_append_sheet(wb,ws,nm);
  });
  const leg=[["Serviço","Código","Significado"]];
  DB.services.forEach(s=>s.turnos.forEach(t=>leg.push([s.name,t.code,t.label])));
  const wsl=XLSX.utils.aoa_to_sheet(leg);wsl["!cols"]=[{wch:20},{wch:10},{wch:30}];
  XLSX.utils.book_append_sheet(wb,wsl,"Legenda");
  XLSX.writeFile(wb,`EscalaCPO_Apanhado_${MESES[month]}_${year}.xlsx`);
  toast("Ficheiro .xlsx gerado.");
}

function exportEscala(){
  const {month,year}=DB.period;
  if(!DB.schedule)DB.schedule={};
  const dim=daysIn(month,year);
  const rows=[["Dia","Dia Semana","Operacional","Nº Mecanográfico","Corpo de Bombeiros","Categoria"]];
  for(let d=1;d<=dim;d++){
    const dow=new Date(year,month,d).getDay();
    const key=String(d);
    const agendados=DB.schedule[key]||[];
    if(agendados.length){
      agendados.forEach(p=>{
        rows.push([d,DOW_FULL[dow],p.name,p.num||'',p.corpo||'',p.categoria||'']);
      });
    } else {
      rows.push([d,DOW_FULL[dow],'—','','','']);
    }
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:6},{wch:12},{wch:28},{wch:16},{wch:32}];
  // Zebra e fins de semana
  for(let r=1;r<rows.length;r++){
    const d=rows[r][0];if(isNaN(d))continue;
    const dow=new Date(year,month,d).getDay();
    if(dow===0||dow===6){
      ['A','B','C','D','E'].forEach(col=>{
        const ref=col+(r+1);
        if(ws[ref])ws[ref].s={fill:{fgColor:{rgb:"FFF3E0"}}};
      });
    }
  }
  XLSX.utils.book_append_sheet(wb,ws,"Escala CPO");
  XLSX.writeFile(wb,`EscalaCPO_${MESES[month]}_${year}.xlsx`);
  toast("Escala exportada.");
}

function exportJson(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`backup_cpo_${MESES[DB.period.month]}_${DB.period.year}.json`;a.click();
}
function importJson(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);
    if(confirm("Importar substitui os dados atuais. Continuar?")){DB=d;await persist();renderAdmin();toast("Dados importados.");}
  }catch(err){toast("Ficheiro inválido.");}};
  r.readAsText(f);e.target.value="";
}
